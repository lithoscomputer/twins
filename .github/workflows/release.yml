name: Release binaries

on:
  push:
    tags:
      - "twin-openai-v*"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: ubuntu-22.04-arm
            platform: linux-arm64
          - os: macos-15
            platform: darwin-arm64
    runs-on: ${{ matrix.os }}
    permissions:
      attestations: write # Publish build provenance.
      contents: read # Read the repository source.
      id-token: write # Authenticate the provenance statement.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo build --release --locked -p twin-openai
      - name: Verify GLIBC compatibility
        if: startsWith(matrix.platform, 'linux-')
        shell: bash
        run: |
          required_versions="$(
            readelf --version-info target/release/twin-openai |
              sed -nE 's/.*Name: GLIBC_([0-9.]+).*/\1/p'
          )"
          max_required="$(printf '%s\n' "$required_versions" | sort -V | tail -n 1)"

          if [[ -z "$max_required" ]]; then
            echo "Could not determine the binary's GLIBC requirement."
            exit 1
          fi

          if [[ "$(printf '%s\n' "$max_required" "2.35" | sort -V | tail -n 1)" != "2.35" ]]; then
            echo "Binary requires GLIBC $max_required, newer than the 2.35 limit."
            exit 1
          fi

          echo "Maximum required GLIBC version: $max_required"
      - name: Smoke test binary
        shell: bash
        run: |
          TWIN_OPENAI_BIND_ADDR=127.0.0.1:43471 target/release/twin-openai > server.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" >/dev/null 2>&1 || true
            wait "$server_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          response=""
          for _ in {1..50}; do
            if response="$(curl --silent --fail http://127.0.0.1:43471/healthz 2>/dev/null)"; then
              break
            fi
            sleep 0.1
          done

          if [[ "$response" != '{"status":"ok"}' ]]; then
            cat server.log
            exit 1
          fi
      - name: Package binary
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p dist
          cp target/release/twin-openai dist/twin-openai
          tar -C dist -czf "twin-openai-${PLATFORM}.tar.gz" twin-openai
      - name: Attest release archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: twin-openai-${{ matrix.platform }}.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: twin-openai-${{ matrix.platform }}
          path: twin-openai-*.tar.gz

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # Publish the GitHub release and its assets.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd artifacts
          sha256sum *.tar.gz > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" ./* --generate-notes
