name: Release binaries

on:
  push:
    tags:
      - "twin-openai-v*"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: ubuntu-22.04-arm
            platform: linux-arm64
          - os: macos-15
            platform: darwin-arm64
    runs-on: ${{ matrix.os }}
    permissions:
      attestations: write # Publish build provenance.
      contents: read # Read the repository source.
      id-token: write # Authenticate the provenance statement.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo build --release --locked -p twin-openai
      - name: Verify GLIBC compatibility
        if: startsWith(matrix.platform, 'linux-')
        shell: bash
        run: |
          required_versions="$(
            readelf --version-info target/release/twin-openai |
              sed -nE 's/.*Name: GLIBC_([0-9.]+).*/\1/p'
          )"
          max_required="$(printf '%s\n' "$required_versions" | sort -V | tail -n 1)"

          if [[ -z "$max_required" ]]; then
            echo "Could not determine the binary's GLIBC requirement."
            exit 1
          fi

          if [[ "$(printf '%s\n' "$max_required" "2.35" | sort -V | tail -n 1)" != "2.35" ]]; then
            echo "Binary requires GLIBC $max_required, newer than the 2.35 limit."
            exit 1
          fi

          echo "Maximum required GLIBC version: $max_required"
      - name: Smoke test binary
        shell: bash
        run: |
          TWIN_OPENAI_BIND_ADDR=127.0.0.1:43471 target/release/twin-openai > server.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" >/dev/null 2>&1 || true
            wait "$server_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          response=""
          for _ in {1..50}; do
            if response="$(curl --silent --fail http://127.0.0.1:43471/healthz 2>/dev/null)"; then
              break
            fi
            sleep 0.1
          done

          if [[ "$response" != '{"status":"ok"}' ]]; then
            cat server.log
            exit 1
          fi
      - name: Package binary
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p dist
          cp target/release/twin-openai dist/twin-openai
          tar -C dist -czf "twin-openai-${PLATFORM}.tar.gz" twin-openai
      - name: Attest release archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: twin-openai-${{ matrix.platform }}.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: twin-openai-${{ matrix.platform }}
          path: twin-openai-*.tar.gz

  docker:
    name: Publish Docker image
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      attestations: write # Publish build provenance.
      contents: read # Read the Dockerfile.
      id-token: write # Authenticate the provenance statement.
      packages: write # Publish the image to GHCR.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: twin-openai-linux-*
          merge-multiple: true
      - name: Stage release binaries for the Docker build
        shell: bash
        run: |
          mkdir -p tmp/docker-context/amd64 tmp/docker-context/arm64
          tar -xzf artifacts/twin-openai-linux-x86_64.tar.gz -C tmp/docker-context/amd64
          tar -xzf artifacts/twin-openai-linux-arm64.tar.gz -C tmp/docker-context/arm64
      - uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ghcr.io/lithoscomputer/twin-openai
          tags: |
            type=match,pattern=twin-openai-v(.*),group=1
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Build amd64 image for smoke test
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          tags: twin-openai-smoke:amd64
      - name: Smoke test amd64 image
        shell: bash
        run: |
          container_id="$(docker run --detach --platform linux/amd64 --publish 127.0.0.1:43471:3000 twin-openai-smoke:amd64)"
          cleanup() {
            docker rm --force "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          response=""
          for _ in {1..50}; do
            if response="$(curl --silent --fail http://127.0.0.1:43471/healthz 2>/dev/null)"; then
              break
            fi
            sleep 0.1
          done

          if [[ "$response" != '{"status":"ok"}' ]]; then
            docker logs "$container_id"
            exit 1
          fi
      - name: Build arm64 image for smoke test
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          load: true
          tags: twin-openai-smoke:arm64
      - name: Smoke test arm64 image
        shell: bash
        run: |
          container_id="$(docker run --detach --platform linux/arm64 --publish 127.0.0.1:43472:3000 twin-openai-smoke:arm64)"
          cleanup() {
            docker rm --force "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          response=""
          for _ in {1..50}; do
            if response="$(curl --silent --fail http://127.0.0.1:43472/healthz 2>/dev/null)"; then
              break
            fi
            sleep 0.1
          done

          if [[ "$response" != '{"status":"ok"}' ]]; then
            docker logs "$container_id"
            exit 1
          fi
      - id: build-image
        name: Build and publish multi-platform image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Attest image provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ghcr.io/lithoscomputer/twin-openai
          subject-digest: ${{ steps.build-image.outputs.digest }}
          push-to-registry: true

  release:
    name: Publish GitHub release
    needs: [build, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Publish the GitHub release and its assets.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd artifacts
          sha256sum *.tar.gz > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" ./* --generate-notes
