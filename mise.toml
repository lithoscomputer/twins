[tools]
rust = { version = "1.95.0", components = "rustfmt,clippy" }
"cargo:cargo-insta" = "1.48.0"

[tasks.fmt]
description = "Check formatting"
run = "cargo fmt --check --all"

[tasks.lint]
description = "Run clippy with warnings denied"
run = "cargo clippy --workspace --all-targets --locked -- -D warnings"

[tasks.test]
description = "Run the offline test suite"
run = "cargo test --workspace --locked"

[tasks.ci]
description = "Run every CI check"
depends = ["fmt", "lint", "test"]

[tasks.record]
description = "Re-record live OpenAI captures and regenerate scenario fixtures"
env = { TWIN_OPENAI_RECORD_FIXTURES = "1" }
run = "cargo insta test --test live_openai_contract --accept -- --ignored"

[tasks."record:anthropic"]
description = "Capture live Anthropic contracts and regenerate semantic fixtures"
env = { TWIN_ANTHROPIC_RECORD_FIXTURES = "1" }
run = "cargo test --locked -p twin-anthropic --test live_anthropic_contract -- --ignored --nocapture"

[tasks."replay:anthropic"]
description = "Replay the Anthropic contract fixtures offline"
run = "cargo test --locked -p twin-anthropic --test replay_contract"
